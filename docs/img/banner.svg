<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="AI Drama Producer banner">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.5" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#f9a8d4"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.18" cy="0.05" r="0.75">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.88" cy="0.95" r="0.75">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <pattern id="strip" width="26" height="16" patternUnits="userSpaceOnUse">
      <rect x="7" y="5" width="12" height="6" rx="2" fill="#ffffff" fill-opacity="0.10"/>
    </pattern>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="#0b0b14"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect width="1200" height="300" fill="url(#glowA)"/>
  <rect width="1200" height="300" fill="url(#glowB)"/>

  <rect x="0" y="0" width="1200" height="16" fill="#12121d"/>
  <rect x="0" y="0" width="1200" height="16" fill="url(#strip)"/>
  <rect x="0" y="284" width="1200" height="16" fill="#12121d"/>
  <rect x="0" y="284" width="1200" height="16" fill="url(#strip)"/>

  <g>
    <rect x="52" y="92" width="96" height="96" rx="22" fill="none" stroke="url(#accent)" stroke-width="2.5"/>
    <path d="M92 122 L132 140 L92 158 Z" fill="url(#accent)"/>
    <rect x="76" y="70" width="48" height="12" rx="3" fill="#1f1f2e" stroke="url(#accent)" stroke-width="1.5" transform="rotate(-14 100 76)"/>
    <rect x="60" y="196" width="80" height="7" rx="3.5" fill="url(#bar)" opacity="0.9"/>
    <rect x="60" y="210" width="56" height="7" rx="3.5" fill="#2a2a3d"/>
    <rect x="60" y="224" width="66" height="7" rx="3.5" fill="#2a2a3d"/>
  </g>

  <text x="196" y="132" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="54" font-weight="800" letter-spacing="7" fill="url(#title)">AI DRAMA PRODUCER</text>
  <text x="200" y="176" font-family="'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="23" font-weight="600" fill="#e5e7eb">AI 短剧制片班底 · 从一个剧本到全套生成物料</text>

  <g font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="600">
    <rect x="200" y="204" width="150" height="30" rx="15" fill="#14141f" stroke="#7c3aed" stroke-opacity="0.85"/>
    <text x="275" y="224" text-anchor="middle" fill="#d8caff">三阶段门工作流</text>
    <rect x="360" y="204" width="128" height="30" rx="15" fill="#14141f" stroke="#06b6d4" stroke-opacity="0.85"/>
    <text x="424" y="224" text-anchor="middle" fill="#a5f3fc">合规硬闸门</text>
    <rect x="498" y="204" width="150" height="30" rx="15" fill="#14141f" stroke="#ec4899" stroke-opacity="0.85"/>
    <text x="573" y="224" text-anchor="middle" fill="#fbcfe8">18 条失败模式库</text>
    <rect x="658" y="204" width="128" height="30" rx="15" fill="#14141f" stroke="#f59e0b" stroke-opacity="0.85"/>
    <text x="722" y="224" text-anchor="middle" fill="#fde68a">额度预算门</text>
    <rect x="796" y="204" width="128" height="30" rx="15" fill="#14141f" stroke="#34d399" stroke-opacity="0.85"/>
    <text x="860" y="224" text-anchor="middle" fill="#a7f3d0">双平台画幅</text>
  </g>

  <text x="200" y="262" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#6b7280">Script → Hooks → Character Bible → Asset Anchors → Storyboard → Prompts → Sound → Edit · MIT Open Source</text>
</svg>
